name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Syntax
        run: |
          for f in bin/helpoupou install.sh lib/*.sh lib/notify/*.sh tests/*.sh tests/stubs/*; do
            bash -n "$f"
          done

      - name: ShellCheck (errors)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=error bin/helpoupou install.sh lib/*.sh lib/notify/*.sh tests/*.sh tests/stubs/*

      - name: Tests
        run: tests/run.sh

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
